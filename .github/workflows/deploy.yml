name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # botão para subir sem precisar de commit

concurrency:
  # Dois deploys ao mesmo tempo derrubariam o coletor no meio da troca.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  subir:
    needs: testes          # nada vai para a VPS sem os testes passarem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave e known_hosts
        env:
          CHAVE: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # `tr -d '\r'` nao e paranoia: copiar a chave com `type` no PowerShell
          # entrega fim de linha do Windows, e o OpenSSH recusa com um
          # "error in libcrypto" que nao diz nada sobre a causa real.
          printf '%s\n' "$CHAVE" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Falhar aqui, com mensagem, e muito melhor que falhar tres passos
          # adiante dentro do rsync com "Permission denied (publickey)".
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "::error::O secret SSH_PRIVATE_KEY nao e uma chave valida."
            echo "::error::Copie o arquivo INTEIRO, com as linhas BEGIN e END."
            echo "::error::No Windows: Get-Content ~/.ssh/pmlab_deploy -Raw | Set-Clipboard"
            exit 1
          fi
          echo "chave ok: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
          # Fixar a chave do host evita aceitar qualquer servidor no meio do
          # caminho. Se a droplet for recriada, este passo falha de propósito.
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar código
        run: |
          # --delete mantém a VPS igual ao repositório, mas `data` fica de FORA:
          # é a coleta de dias, e apagá-la num deploy seria irreversível.
          rsync -az --delete \
            --exclude 'data/' \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/pmlab/"

      - name: Reconstruir e reiniciar
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
             cd /opt/pmlab
             mkdir -p data && chown -R 1000:1000 data
             docker compose up -d --build
             docker image prune -f'

      - name: Conferir que subiu de verdade
        run: |
          # Deploy que "passa" e deixa o coletor morto é pior que deploy que
          # falha: ninguém percebe até faltarem horas de dado.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
             cd /opt/pmlab
             for i in $(seq 1 24); do
               if curl -sf -o /dev/null http://127.0.0.1:8787/; then
                 echo "painel respondendo"
                 docker compose ps
                 exit 0
               fi
               sleep 5
             done
             echo "!! painel nao respondeu em 120s"
             docker compose logs --tail 60
             exit 1'
